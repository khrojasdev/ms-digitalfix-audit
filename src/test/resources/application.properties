# Base en memoria para las pruebas: no necesitan Oracle levantado.
# Flyway corre las mismas migraciones (H2 en modo Oracle).
spring.datasource.url=jdbc:h2:mem:audit;MODE=Oracle;DB_CLOSE_DELAY=-1;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
# Sin espera entre reintentos en las pruebas.
amqp.reintentos.espera-ms=1
